name: Live tests

# Read-only tests against the production API. They run only when the repository has a
# BYTNODE_API_KEY secret; without it every test is skipped.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    env:
      BYTNODE_API_KEY: ${{ secrets.BYTNODE_API_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: python -m pip install -e "python[pandas]" pytest pytest-asyncio respx
      - run: cd python && pytest -m live -q
      - run: cd typescript && npm ci && npm run test:live
